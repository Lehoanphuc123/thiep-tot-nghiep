<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3e3e8">
  <title>Thiệp mời tốt nghiệp của Hồng Thu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
   <noscript><link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Vùng kéo được neo trực tiếp vào phong bì, không neo vào toàn màn hình */
    .envelope-wrap {
      position: relative;
    }

    .envelope-wrap .envelope-slider {
      position: absolute;
      left: 17.5%;
      top: 50%;
      transform: translateY(-50%);
      width: 65%;
      height: 64px;
      margin: 0;
      padding: 0;
      z-index: 30;
      opacity: 0;
      cursor: grab;
      touch-action: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .lock-open-button {
      position: absolute;
      left: 50%;
      top: 59%;
      transform: translate(-50%, -50%);
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 112px;
      min-height: 76px;
      padding: 9px 14px;
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 16px;
      background: rgba(255,248,250,.94);
      color: #9b536d;
      box-shadow: 0 5px 18px rgba(111,54,76,.18);
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .lock-open-button:active {
      transform: translate(-50%, -50%) scale(.94);
    }
    .lock-icon {
      display: block;
      font-size: 30px;
      line-height: 1;
      transition: transform .35s ease;
    }
    .lock-text {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .lock-open-button.unlocked .lock-icon {
      transform: rotate(-18deg) scale(1.15);
    }
    .lock-open-button:disabled {
      cursor: default;
      opacity: .85;
    }
  
    /* Tăng tốc chuyển trang khi bấm nút mũi tên */
    .page {
      transition: opacity .12s ease, transform .18s ease !important;
    }
    .page.active {
      animation-duration: .18s !important;
    }
    .page.turn-next,
    .page.turn-prev {
      transition-duration: .18s !important;
      animation-duration: .18s !important;
    }

  
    /* Nơ hồng ôm quanh huy hiệu HT */
    .wax-seal { position:relative; z-index:33; width:116px; height:116px; border-radius:50%; background:radial-gradient(circle at 35% 28%,#f7b7d0 0%,#e78eb4 58%,#ce6795 100%); border:3px solid #f5c7d8; box-shadow:0 5px 16px rgba(111,54,76,.22),inset 0 0 0 3px rgba(255,255,255,.2); }
    .wax-seal span { color:#fff5f8; text-shadow:0 2px 3px rgba(137,54,91,.25); font-family:'Great Vibes',cursive; font-size:48px; position:relative; z-index:2; }
    .ht-bow { position:absolute; left:50%; top:50%; width:190px; height:104px; transform:translate(-50%,-50%); z-index:31; pointer-events:none; filter:drop-shadow(0 3px 3px rgba(125,55,82,.2)); opacity:1; transition:opacity .35s ease, transform .45s ease; }
    .bow-loop { position:absolute; top:32px; width:56px; height:36px; background:linear-gradient(145deg,#ffe2ec,#e989b1 72%,#d66e9a); border:2px solid #ffd7e5; border-radius:80% 18% 75% 22%; }
    .bow-loop-left { left:0; transform:rotate(18deg); }
    .bow-loop-right { right:0; transform:scaleX(-1) rotate(18deg); }
    .bow-knot { position:absolute; left:85px; top:41px; width:20px; height:19px; border-radius:7px; background:linear-gradient(135deg,#fff0f5,#d96f9c); border:2px solid #ffe0eb; z-index:2; }
    .bow-tail { position:absolute; top:61px; width:23px; height:39px; background:linear-gradient(90deg,#f9c0d5,#df7da5); clip-path:polygon(0 0,100% 0,85% 100%,50% 78%,12% 100%); }
    .bow-tail-left { left:68px; transform:rotate(15deg); } .bow-tail-right { right:68px; transform:rotate(-15deg); }

    /* Ổ khóa nhỏ xinh */
    .lock-open-button { position:absolute; left:50%; top:65%; transform:translate(-50%,-50%); z-index:45; width:82px; height:88px; min-width:0; min-height:0; padding:0; border:0; border-radius:0; background:transparent; box-shadow:none; display:flex; align-items:center; justify-content:center; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    .lock-open-button:active { transform:translate(-50%,-50%) scale(.96); }
    .lock-icon { position:relative; display:block; width:62px; height:70px; filter:drop-shadow(0 4px 5px rgba(154,72,112,.25)); transform-origin:50% 75%; }
    /* Ổ khóa hình trái tim màu hồng pastel */
    .lock-body {
      position:absolute; left:5px; bottom:0; width:52px; height:49px;
      background:linear-gradient(145deg,#fff0f6 0%,#ffb6d1 42%,#f27eaa 100%);
      clip-path:polygon(50% 100%,7% 57%,1% 39%,5% 20%,19% 7%,35% 8%,50% 25%,65% 8%,81% 7%,95% 20%,99% 39%,93% 57%);
      display:flex; align-items:center; justify-content:center; z-index:2;
      filter:drop-shadow(0 2px 1px rgba(188,83,126,.15));
    }
    .lock-body:before {
      content:""; position:absolute; inset:3px 4px 5px;
      clip-path:polygon(50% 100%,7% 57%,1% 39%,5% 20%,19% 7%,35% 8%,50% 25%,65% 8%,81% 7%,95% 20%,99% 39%,93% 57%);
      border:1px solid rgba(255,255,255,.65); pointer-events:none;
    }
    .lock-hole { width:9px; height:15px; border-radius:8px 8px 5px 5px; background:#a94d78; position:relative; z-index:2; margin-top:3px; box-shadow:0 1px 2px rgba(104,37,71,.2); }
    .lock-hole:after { content:""; position:absolute; left:2px; bottom:-5px; width:5px; height:8px; background:#a94d78; border-radius:0 0 4px 4px; }
    .lock-shackle { position:absolute; left:15px; top:1px; width:32px; height:38px; border:6px solid #fff0c9; border-bottom:0; border-radius:18px 18px 0 0; box-sizing:border-box; transform-origin:88% 88%; z-index:1; filter:drop-shadow(0 1px 1px rgba(169,91,119,.2)); }
    .lock-sparkle { position:absolute; right:9px; top:18px; color:#fff; font-size:10px; z-index:3; text-shadow:0 1px 2px #e779a7; }
    .key-icon { position:absolute; left:-32px; bottom:-23px; z-index:4; font-size:30px; opacity:0; transform:translate(-24px,28px) rotate(-45deg) scale(.65); pointer-events:none; }
    .lock-open-button.key-animating .key-icon { animation:keyFlyIntoLock .78s cubic-bezier(.2,.75,.25,1) forwards; }
    .lock-open-button.key-animating .lock-shackle { animation:shackleUnlock .65s ease .78s forwards; }
    .lock-open-button.key-animating .lock-body { animation:lockBodyPop .55s ease 1.05s forwards; }
    .lock-open-button.key-animating .lock-icon { animation:lockJiggle .35s ease .78s 1; }
    .lock-open-button.unlocked .lock-shackle { transform:translate(7px,-10px) rotate(38deg); }
    .lock-open-button.unlocked .lock-body { transform:rotate(9deg) translateY(3px); transition:transform .35s ease; }
    .lock-open-button:disabled { cursor:default; }
    .envelope-wrap.bow-released .ht-bow { opacity:0; transform:translate(-50%,-50%) scale(1.22) rotate(-12deg); }
    @keyframes keyFlyIntoLock { 0%{opacity:0;transform:translate(-24px,28px) rotate(-45deg) scale(.65)} 16%{opacity:1} 70%{opacity:1;transform:translate(25px,-12px) rotate(0) scale(1)} 88%{opacity:1;transform:translate(29px,-9px) rotate(18deg) scale(.95)} 100%{opacity:0;transform:translate(34px,-5px) rotate(45deg) scale(.8)} }
    @keyframes shackleUnlock { 0%{transform:rotate(0)} 45%{transform:translate(2px,-5px) rotate(-18deg)} 100%{transform:translate(7px,-10px) rotate(38deg)} }
    @keyframes lockBodyPop { 0%{transform:scale(1)} 45%{transform:scale(1.12) rotate(-7deg)} 100%{transform:scale(1) rotate(7deg) translateY(3px)} }
    @keyframes lockJiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-7deg)} 55%{transform:rotate(7deg)} }

  </style>
</head>

<body>
  <main class="stage" id="stage" aria-label="Thiệp mời tốt nghiệp">

    <div class="envelope-screen" id="envelopeScreen">
      <div class="floating-decor decor-1">✦</div>
      <div class="floating-decor decor-2">✧</div>
      <div class="floating-decor decor-3">♡</div>
      <div class="floating-decor decor-4">✦</div>

      <div class="envelope-title">
        <span class="eyebrow">BUỔI LỄ TỐT NGHIỆP CỬ NHÂN QTKD CỦA </span>
         <span class="eyebrow2">
           <span>H</span><span>U</span><span>Ỳ</span><span>N</span><span>H</span>
           
          <span>T</span><span>H</span><span>Ị</span>
 
  <span>H</span><span>Ồ</span><span>N</span><span>G</span>
 
  <span>T</span><span>H</span><span>U</span>
</span>
        <h1>A little surprise<br>for you</h1>
        <div class="title-divider">✦ ♡ ✦</div>
      </div>

      <div class="envelope-wrap" id="envelopeWrap">
        <div class="envelope-back"></div>

        <div class="envelope-letter">
          <div class="letter-ornament">✧</div>
          <p>You're invited</p>
          <h2>Hồng Thu</h2>
          <span>GRADUATION 2026</span>
          <div class="letter-date">22 · 11 · 2026</div>
        </div>

        <div class="envelope-flap"></div>
        <div class="envelope-front"></div>
        <div class="ribbon ribbon-horizontal"></div>
        <div class="ribbon ribbon-vertical"></div>

        <div class="wax-seal">
          <span>HT</span>
        </div>

        <div class="ht-bow" aria-hidden="true">
          <span class="bow-loop bow-loop-left"></span><span class="bow-loop bow-loop-right"></span>
          <span class="bow-knot"></span><span class="bow-tail bow-tail-left"></span><span class="bow-tail bow-tail-right"></span>

        <button class="lock-open-button" id="lockOpenButton" type="button" aria-label="Chạm vào ổ khóa để mở thiệp">

          <span class="key-icon" id="keyIcon" aria-hidden="true">🗝️</span>
        </button>


      </div>

      <div class="open-instruction">
        <span>✦</span>
        Anh em ơi, chạm vào ổ khóa để mở thiệp nhé!
        <span>✦</span>
      </div>

      <p class="envelope-subtitle">
        Một lời mời đặc biệt đang chờ bạn
      </p>

      <div class="envelope-footer">
        MADE WITH LOVE · HỒNG THU
      </div>



      <div class="confetti-container" id="confettiContainer"></div>
    </div>

    <!-- 12 ẢNH MỚI -->
    <img class="page active" src="images/01.jpg" alt="Trang 01">
    <img class="page" src="images/02.jpg" alt="Trang 02" loading="lazy">
    <img class="page" src="images/03.jpg" alt="Trang 03" loading="lazy">
    <img class="page" src="images/04.jpg" alt="Trang 04" loading="lazy">
    <img class="page" src="images/05.jpg" alt="Trang 05" loading="lazy">
    <img class="page" src="images/06.jpg" alt="Trang 06" loading="lazy">
    <img class="page" src="images/07.jpg" alt="Trang 07" loading="lazy">
    <img class="page" src="images/08.jpg" alt="Trang 08" loading="lazy">
    <img class="page" src="images/09.jpg" alt="Trang 09" loading="lazy">
    <img class="page" src="images/010.jpg" alt="Trang 010" loading="lazy">
    <img class="page" src="images/011.jpg" alt="Trang 011" loading="lazy">
    <img class="page" src="images/012.jpg" alt="Trang 012" loading="lazy">

  </main>

  <nav class="bar hidden" id="navigation" aria-label="Điều hướng trang thiệp">
    <button class="nav" id="prev" type="button" aria-label="Trang trước">&#8592;</button>
    <div class="dots" id="dots" role="tablist" aria-label="Chọn trang"></div>
    <button class="nav" id="next" type="button" aria-label="Trang sau">&#8594;</button>
  </nav>

  <script>
  (function () {
    var pages = Array.prototype.slice.call(document.querySelectorAll('.page'));
    var stage = document.getElementById('stage');
    var dotsBox = document.getElementById('dots');
    var prev = document.getElementById('prev');
    var next = document.getElementById('next');
    var navigation = document.getElementById('navigation');
    var envelopeScreen = document.getElementById('envelopeScreen');
    var lockOpenButton = document.getElementById('lockOpenButton');
    var confettiContainer = document.getElementById('confettiContainer');

    var cur = 0;
    var envelopeOpened = false;
    var isTurning = false;

    var backgroundMusic = new Audio('sounds/back2.m4a');
    var openSound = new Audio('sounds/open.mp3');
    var clickSound = new Audio('sounds/click.mp3');

    backgroundMusic.loop = true;
    backgroundMusic.volume = 0.30;
    backgroundMusic.preload = 'auto';
    backgroundMusic.autoplay = true;
    backgroundMusic.setAttribute('autoplay', '');
    backgroundMusic.setAttribute('playsinline', '');
    openSound.volume = 0.75;
    clickSound.volume = 0.35;

    var musicStarted = false;
    var musicStarting = false;

    function startBackgroundMusic() {
      if (musicStarted || musicStarting) {
        return;
      }

      musicStarting = true;

      try {
        var playPromise = backgroundMusic.play();

        if (playPromise && typeof playPromise.then === 'function') {
          playPromise.then(function () {
            musicStarted = true;
            musicStarting = false;
          }).catch(function (error) {
            musicStarted = false;
            musicStarting = false;
            console.log('Không thể phát nhạc:', error);
          });
        } else {
          musicStarted = true;
          musicStarting = false;
        }
      } catch (error) {
        musicStarted = false;
        musicStarting = false;
        console.log('Lỗi phát nhạc:', error);
      }
    }

    // Thử tự phát nhạc ngay khi giao diện vừa tải.
    // Nếu trình duyệt chặn autoplay có tiếng, các thao tác chạm/kéo sẽ thử phát lại.
    startBackgroundMusic();

    function playOpenSound() {
      openSound.currentTime = 0;
      openSound.play().catch(function () {});
    }

    function playClickSound() {
      clickSound.currentTime = 0;
      clickSound.play().catch(function () {});
    }

    var dots = pages.map(function (_, i) {
      var d = document.createElement('button');
      d.className = 'dot';
      d.type = 'button';
      d.setAttribute('role', 'tab');
      d.setAttribute('aria-label', 'Trang ' + (i + 1));

      d.addEventListener('click', function () {
        if (envelopeOpened) go(i);
      });

      dotsBox.appendChild(d);
      return d;
    });

    function updatePages() {
      pages.forEach(function (p, i) {
        p.classList.toggle('active', i === cur);
        p.classList.toggle('flipped', i < cur);
        p.classList.toggle('before', i < cur);
        p.classList.remove('turn-next', 'turn-prev', 'dragging');

        p.style.zIndex = pages.length - i;
        p.style.transform = '';
        p.style.transition = '';

        p.setAttribute('aria-hidden', i === cur ? 'false' : 'true');
      });

      dots.forEach(function (d, i) {
        d.classList.toggle('on', i === cur);
        d.setAttribute('aria-selected', i === cur ? 'true' : 'false');
      });

      prev.disabled = cur === 0;
      next.disabled = cur === pages.length - 1;
    }

    function go(n, playSound) {
      if (!envelopeOpened || isTurning) return;
      if (n < 0 || n >= pages.length || n === cur) return;

      var oldPage = cur;
      var turnPage;

      isTurning = true;

      if (playSound !== false) playClickSound();

      if (n > oldPage) {
        for (var i = oldPage + 1; i < n; i++) {
          pages[i].classList.add('flipped');
        }

        turnPage = pages[oldPage];
        turnPage.style.zIndex = pages.length + 10;
        turnPage.classList.add('turn-next');
      } else {
        turnPage = pages[n];
        turnPage.classList.remove('flipped');
        turnPage.style.zIndex = pages.length + 10;
        turnPage.classList.add('turn-prev');
      }

      setTimeout(function () {
        cur = n;
        updatePages();
        isTurning = false;
      }, 220);
    }

    prev.addEventListener('click', function () {
      go(cur - 1);
    });

    next.addEventListener('click', function () {
      go(cur + 1);
    });

    /* KÉO LẬT TRANG THEO CHUỘT */
    var dragStartX = 0;
    var dragCurrentX = 0;
    var dragProgress = 0;
    var dragWidth = 0;
    var isDragging = false;
    var dragMoved = false;
    var suppressClick = false;
    var activeDragPage = null;
    var previousDragPage = null;

    stage.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'mouse') return;
      if (e.button !== 0 || !envelopeOpened || isTurning) return;
      if (!e.target.classList.contains('page')) return;
      if (!e.target.classList.contains('active')) return;

      isDragging = true;
      dragMoved = false;
      dragStartX = e.clientX;
      dragCurrentX = e.clientX;
      dragProgress = 0;

      dragWidth = e.target.getBoundingClientRect().width;
      activeDragPage = e.target;
      previousDragPage = pages[cur - 1] || null;

      activeDragPage.classList.add('dragging');
      activeDragPage.style.zIndex = pages.length + 10;
      activeDragPage.style.transition = 'none';

      if (previousDragPage) {
        previousDragPage.style.zIndex = pages.length + 9;
      }

      stage.setPointerCapture(e.pointerId);
    });

    stage.addEventListener('pointermove', function (e) {
      if (!isDragging || !activeDragPage) return;

      dragCurrentX = e.clientX;

      var distance = dragStartX - dragCurrentX;

      if (Math.abs(distance) > 8) dragMoved = true;

      dragProgress = Math.min(Math.abs(distance) / dragWidth, 1);

      if (distance > 0) {
        // Kéo sang trái: lật trang hiện tại
        activeDragPage.style.transform =
          'rotateY(' + (-180 * dragProgress) + 'deg)';
      } else if (previousDragPage) {
        // Kéo sang phải: mở lại trang trước
        previousDragPage.style.transition = 'none';
        previousDragPage.style.transform =
          'rotateY(' + (-180 + 180 * dragProgress) + 'deg)';
      }
    });

    function finishDrag(cancelled) {
      if (!isDragging) return;

      isDragging = false;

      var distance = dragStartX - dragCurrentX;
      var shouldTurn = !cancelled && dragProgress >= 0.25;

      if (dragMoved) {
        suppressClick = true;
        setTimeout(function () {
          suppressClick = false;
        }, 500);
      }

      if (activeDragPage) {
        activeDragPage.classList.remove('dragging');
      }

      if (shouldTurn && distance > 0 && cur < pages.length - 1) {
        activeDragPage.style.transition = '';
        activeDragPage.style.transform = '';
        activeDragPage.style.zIndex = '';
        activeDragPage = null;
        previousDragPage = null;
        dragProgress = 0;
        dragMoved = false;
        go(cur + 1);
        return;
      }

      if (shouldTurn && distance < 0 && cur > 0) {
        if (previousDragPage) {
          previousDragPage.style.transition = '';
          previousDragPage.style.transform = '';
          previousDragPage.style.zIndex = '';
        }

        activeDragPage.style.transition = '';
        activeDragPage.style.transform = '';
        activeDragPage.style.zIndex = '';
        activeDragPage = null;
        previousDragPage = null;
        dragProgress = 0;
        dragMoved = false;
        go(cur - 1);
        return;
      }

      // Chưa kéo đủ: trả trang về vị trí ban đầu
      if (activeDragPage) {
        activeDragPage.style.transition = 'transform .45s ease';
        activeDragPage.style.transform = '';
        activeDragPage.style.zIndex = '';
      }

      if (previousDragPage) {
        previousDragPage.style.transition = 'transform .45s ease';
        previousDragPage.style.transform = 'rotateY(-180deg)';
        previousDragPage.style.zIndex = '';

        setTimeout(function () {
          if (previousDragPage) previousDragPage.style.transition = '';
        }, 500);
      }

      setTimeout(function () {
        if (activeDragPage) {
          activeDragPage.style.transition = '';
          activeDragPage.style.zIndex = '';
        }
      }, 500);

      activeDragPage = null;
      previousDragPage = null;
      dragProgress = 0;
      dragMoved = false;
    }

    stage.addEventListener('pointerup', function () {
      finishDrag(false);
    });

    stage.addEventListener('pointercancel', function () {
      finishDrag(true);
    });

    pages.forEach(function (p) {
      p.addEventListener('click', function (e) {
        if (suppressClick) {
          e.preventDefault();
          e.stopPropagation();
          return;
        }

        if (envelopeOpened && cur < pages.length - 1) {
          go(cur + 1);
        }
      });
    });

    document.addEventListener('keydown', function (e) {
      if (!envelopeOpened) return;

      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        go(cur + 1);
      } else if (e.key === 'ArrowLeft') {
        go(cur - 1);
      }
    });

    /* VUỐT TRÊN ĐIỆN THOẠI */
    var touchStartX = null;

    stage.addEventListener('touchstart', function (e) {
      if (!envelopeOpened) return;
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    stage.addEventListener('touchend', function (e) {
      if (!envelopeOpened || touchStartX === null) return;

      var dx = e.changedTouches[0].clientX - touchStartX;

      if (Math.abs(dx) > 50) {
        if (dx < 0) go(cur + 1);
        else go(cur - 1);
      }

      touchStartX = null;
    }, { passive: true });

    function createConfetti() {
      var colors = ['#e7a6bd', '#d9ac67', '#ffffff', '#f4cfda', '#c8799b'];

      for (var i = 0; i < 28; i++) {
        var piece = document.createElement('span');
        piece.className = 'confetti';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = Math.random() * .5 + 's';
        piece.style.animationDuration = (1.5 + Math.random() * 1.3) + 's';
        piece.style.setProperty('--drift', (Math.random() * 180 - 90) + 'px');
        confettiContainer.appendChild(piece);
      }
    }

    function openEnvelope() {
      if (envelopeOpened) return;

      envelopeOpened = true;
      playOpenSound();

      envelopeScreen.classList.add('opening');
      createConfetti();

      setTimeout(function () {
        envelopeScreen.classList.add('opened');
      }, 1450);

      setTimeout(function () {
        envelopeScreen.style.display = 'none';
        navigation.classList.remove('hidden');
        updatePages();
      }, 2450);
    }

    // Chạm vào ổ khóa để mở thiệp. Đây cũng là thao tác kích hoạt nhạc.
    lockOpenButton.addEventListener('click', function () {
      if (envelopeOpened || lockOpenButton.disabled) return;
      startBackgroundMusic();
      lockOpenButton.disabled = true;
      lockOpenButton.classList.add('key-animating');

      setTimeout(function () {
        lockOpenButton.classList.add('unlocked');
        envelopeWrap.classList.add('bow-released');
      }, 760);

      setTimeout(function () {
        openEnvelope();
      }, 1450);
    });

    /* KHỞI TẠO */
    pages.forEach(function (p, i) {
      p.style.zIndex = pages.length - i;
      p.classList.toggle('active', i === 0);
      p.classList.remove('flipped', 'before');
      p.setAttribute('aria-hidden', i === 0 ? 'false' : 'true');
    });

    prev.disabled = true;

    dots.forEach(function (d, i) {
      d.classList.toggle('on', i === 0);
    });
  })();
  </script>
</body>
</html>
